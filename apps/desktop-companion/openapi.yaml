  # ── Outputs ──────────────────────────────────────────────────────────────
  /api/outputs:
    get:
      tags: [Outputs]
      summary: List outputs with filtering
      operationId: listOutputs
      security: []
      parameters:
        - name: sessionId
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, approved, published, archived]
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: orderBy
          in: query
          schema:
            type: string
            enum: [createdAt, updatedAt]
            default: createdAt
        - name: orderDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated output list

  /api/outputs/{id}:
    get:
      tags: [Outputs]
      summary: Get output by ID (includes session info)
      operationId: getOutput
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Output with session context
        "404":
          description: Output not found
    patch:
      tags: [Outputs]
      summary: Update output content and metadata
      operationId: updateOutput
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 500
                text:
                  type: string
                  maxLength: 10000
                refs:
                  type: array
                  items:
                    type: string
                meta:
                  type: object
                status:
                  type: string
                  enum: [draft, approved, published, archived]
      responses:
        "200":
          description: Output updated
        "404":
          description: Output not found
    delete:
      tags: [Outputs]
      summary: Delete an output
      operationId: deleteOutput
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Output deleted
        "404":
          description: Output not found

  /api/outputs/{id}/status:
    patch:
      tags: [Outputs]
      summary: Update output status only
      operationId: updateOutputStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [draft, approved, published, archived]
      responses:
        "200":
          description: Status updated

  /api/outputs/{id}/regenerate:
    post:
      tags: [Outputs]
      summary: Regenerate output content using AI
      operationId: regenerateOutput
      description: |
        Uses AI to regenerate the output text with a fresh perspective.
        Rate limited to 10 requests per minute per user.
        Returns regeneration metadata including token usage and duration.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instructions:
                  type: string
                  maxLength: 1000
                  description: Optional custom instructions for regeneration
      responses:
        "200":
          description: Output regenerated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      output:
                        $ref: '#/components/schemas/Output'
                      regenerationMetadata:
                        type: object
                        properties:
                          durationMs:
                            type: integer
                          tokensUsed:
                            type: integer
        "404":
          description: Output not found
        "429":
          description: Rate limit exceeded (10 req/min)
        "503":
          description: AI service not configured

