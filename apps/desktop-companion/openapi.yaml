      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        "200":
          description: Session moments
    post:
      tags: [Sessions, Events]
      summary: Create moment for a session
      operationId: createSessionMoment
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, timestamp]
              properties:
                type:
                  type: string
                  enum: [hype, qa, sponsor, clip, highlight, marker]
                label:
                  type: string
                description:
                  type: string
                timestamp:
                  type: number
                clipId:
                  type: string
      responses:
        "201":
          description: Moment created

  /api/sessions/{sessionId}/events/moments/{momentId}:
    delete:
      tags: [Sessions, Events]
      summary: Delete moment from a session
      operationId: deleteSessionMoment
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - name: momentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Moment deleted
        "403":
