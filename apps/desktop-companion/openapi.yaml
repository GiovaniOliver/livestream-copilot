openapi: 3.1.0
info:
  title: FluxBoard Livestream Copilot API
  description: |
    REST API for the FluxBoard Livestream Copilot desktop companion service.

    FluxBoard provides real-time livestream capture, AI-powered content generation,
    OBS Studio integration, clip management, social media export, and video streaming
    for content creators.

    ## Authentication

    Most endpoints require authentication via one of two methods:

    1. **Bearer JWT** - Pass an access token in the `Authorization` header.
    2. **API Key** - Pass an API key in the `x-api-key` header.

    Public endpoints (health checks, OBS status, event reads) do not require authentication
    during development.

    ## WebSocket Events

    The server exposes a WebSocket on a configurable port (default 9001). Clients receive
    real-time `EventEnvelope` messages for session lifecycle, transcripts, clips, outputs,
    and trigger detections. Connect and listen for JSON messages.

    Event types: `SESSION_START`, `SESSION_END`, `TRANSCRIPT_SEGMENT`, `MOMENT_MARKER`,
    `CLIP_INTENT_START`, `CLIP_INTENT_END`, `ARTIFACT_CLIP_CREATED`, `ARTIFACT_FRAME_CREATED`,
    `OUTPUT_CREATED`, `OUTPUT_VALIDATED`, `AUTO_TRIGGER_DETECTED`, `CLIP_QUEUE_UPDATED`.

    ## Rate Limiting

    Rate-limited endpoints return standard `RateLimit-*` headers. When exceeded, the server
    responds with `429 Too Many Requests`.

    | Endpoint Group        | Limit              |
    |-----------------------|--------------------|
    | Session list          | 30 req/min per IP  |
    | Session read          | 100 req/min per IP |
    | Output regenerate     | 10 req/min per user|
    | Auth login            | 5 per 15min per IP:email |
    | Auth register         | 3 per hour per IP  |
    | Auth password reset   | 3 per hour per IP  |
    | Auth token refresh    | 10 per min per IP  |

  version: 1.0.0
  contact:
    name: FluxBoard Engineering
  license:
    name: Proprietary

servers:
  - url: http://localhost:4555
    description: Local development server
  - url: http://localhost:{port}
    description: Custom port
    variables:
      port:
        default: "4555"

tags:
  - name: Health
    description: Service health and status endpoints
  - name: Auth
    description: User registration, login, token management, and password flows
  - name: OAuth
    description: OAuth provider authentication (Google, GitHub, Twitch)
  - name: Sessions
    description: Livestream session lifecycle management
  - name: Events
    description: Session event and moment marker management
  - name: Outputs
    description: AI-generated content output management
  - name: Clips
    description: Video clip management
  - name: ClipQueue
    description: Clip processing queue management
  - name: OBS
    description: OBS Studio WebSocket control (scenes, streaming, recording, replay)
  - name: Recordings
    description: Mobile recording uploads
  - name: Triggers
    description: Auto-trigger configuration (audio phrases, visual references)
  - name: Billing
    description: Subscription plans, checkout, and usage
  - name: Export
    description: Social media post and clip export
  - name: Branding
    description: Video branding overlays, intros, outros, and presets
  - name: Social
    description: Social media platform connections and posting
  - name: Video
    description: MediaMTX video streaming server control
  - name: Agents
    description: AI agent observability and status
  - name: STT
    description: Speech-to-text transcription control
  - name: FFmpeg
    description: FFmpeg availability status
  - name: Legacy
    description: Legacy session and clip endpoints (non-prefixed)

security:
  - BearerAuth: []
  - ApiKeyAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /api/v1/auth/login or /api/v1/auth/refresh
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Static API key for service-to-service communication

  schemas:
    # ── Common ─────────────────────────────────────────────────────────────
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required: [success]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: "field: Invalid value"
          required: [code, message]
      required: [success, error]

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      required: [ok]

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
        total:
          type: integer
          example: 12

    # ── Auth ───────────────────────────────────────────────────────────────
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        platformRole:
          type: string
        status:
          type: string
        organizations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              role:
                type: string

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Token lifetime in seconds
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/AuthUser'

    # ── Session ────────────────────────────────────────────────────────────
    Session:
      type: object
      properties:
        id:
          type: string
          description: CUID primary key
          example: cmlbcgemg0000i7b80ufgh3ko
        workflow:
          type: string
          enum: [streamer, writers_room, brainstorm, debate, podcast]
        captureMode:
          type: string
          enum: [audio, video, av]
        title:
          type: string
          nullable: true
        participants:
          type: array
          items:
            type: string
        status:
          type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isActive:
          type: boolean
          description: Whether the session is currently running in memory
        counts:
          type: object
          properties:
            events:
              type: integer
            outputs:
              type: integer
            clips:
              type: integer

    # ── Event ──────────────────────────────────────────────────────────────
    Event:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        type:
          type: string
          enum:
            - SESSION_START
            - SESSION_END
            - TRANSCRIPT_SEGMENT
            - MOMENT_MARKER
            - CLIP_INTENT_START
            - CLIP_INTENT_END
            - ARTIFACT_CLIP_CREATED
            - ARTIFACT_FRAME_CREATED
            - OUTPUT_CREATED
            - OUTPUT_VALIDATED
            - AUTO_TRIGGER_DETECTED
            - CLIP_QUEUE_UPDATED
        payload:
          type: object
        ts:
          type: string
          description: Unix timestamp as string (BigInt)
        timestamp:
          type: number
          description: Unix timestamp as number
        traceId:
          type: string
          nullable: true
        spanId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Moment:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        type:
          type: string
          enum: [hype, qa, sponsor, clip, highlight, marker]
        label:
          type: string
        description:
          type: string
          nullable: true
        timestamp:
          type: number
          description: Seconds from session start
        clipId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── Output ─────────────────────────────────────────────────────────────
    Output:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        category:
          type: string
        title:
          type: string
          nullable: true
        text:
          type: string
        refs:
          type: array
          items:
            type: string
        meta:
          type: object
          nullable: true
        status:
          type: string
          enum: [draft, approved, published, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Clip ───────────────────────────────────────────────────────────────
    Clip:
      type: object
      properties:
        id:
          type: string
        artifactId:
          type: string
        sessionId:
          type: string
        path:
          type: string
        t0:
          type: number
          description: Start time in seconds from session start
        t1:
          type: number
          description: End time in seconds from session start
        duration:
          type: number
          description: Duration in seconds (t1 - t0)
        thumbnailId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── ClipQueueItem ──────────────────────────────────────────────────────
    ClipQueueItem:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        clipId:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, recording, processing, completed, failed]
        triggerType:
          type: string
          enum: [audio, visual, manual]
        triggerSource:
          type: string
          nullable: true
        triggerConfidence:
          type: number
          nullable: true
        t0:
          type: number
        t1:
          type: number
          nullable: true
        duration:
          type: number
          nullable: true
        thumbnailPath:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Recording ──────────────────────────────────────────────────────────
    MobileRecording:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        size:
          type: integer
        uploadedAt:
          type: string
          format: date-time

    # ── Billing ────────────────────────────────────────────────────────────
    Plan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        features:
          type: array
          items:
            type: string
        monthlyPriceId:
          type: string
        yearlyPriceId:
          type: string

    # ── Social ─────────────────────────────────────────────────────────────
    SocialPlatform:
      type: string
      enum: [YOUTUBE, TWITTER, TIKTOK, LINKEDIN, INSTAGRAM, FACEBOOK, THREADS, BLUESKY]

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^c[a-z0-9]{24,}$'
      description: Session CUID
    SessionIdParam:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
      description: Session ID
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 100
        minimum: 1
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0

# =============================================================================
# PATHS
# =============================================================================
paths:
  # ── Health ─────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Service health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service status with component health
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                    example: desktop-companion
                  version:
                    type: string
                  uptime:
                    type: number
                  timestamp:
                    type: string
                    format: date-time
                  database:
                    type: boolean
                  ffmpeg:
                    type: boolean
                  agents:
                    type: boolean
                  sessionId:
                    type: string
                    nullable: true
                  components:
                    type: object
                  session:
                    type: object

  /api/health:
    get:
      tags: [Health]
      summary: Service health check (API-prefixed alias)
      operationId: getHealthApi
      security: []
      responses:
        "200":
          description: Same as /health

  /ffmpeg/status:
    get:
      tags: [FFmpeg]
      summary: FFmpeg availability status
      operationId: getFFmpegStatus
      security: []
      responses:
        "200":
          description: FFmpeg and FFprobe availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ready:
                        type: boolean
                      ffmpeg:
                        type: object
                      ffprobe:
                        type: object
                      clipOutputFormat:
                        type: string
                      ffmpegPath:
                        type: string
                      ffprobePath:
                        type: string

  # ── Auth ─────────────────────────────────────────────────────────────────
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user account
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                name:
                  type: string
                  maxLength: 100
            example:
              email: creator@example.com
              password: SecurePass123!@
              name: Stream Creator
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Email already registered
        "429":
          description: Rate limit exceeded (3 per hour per IP)

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and receive tokens
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: creator@example.com
              password: SecurePass123!@
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Invalid credentials
        "429":
          description: Rate limit exceeded (5 per 15min per IP:email)

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      expiresIn:
                        type: integer
                      tokenType:
                        type: string
                        example: Bearer
        "401":
          description: Invalid or expired refresh token

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      operationId: logoutUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Logged out (always succeeds to prevent token enumeration)

  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke all refresh tokens for the current user
      operationId: logoutAllSessions
      responses:
        "200":
          description: All sessions terminated

  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  maxLength: 256
      responses:
        "200":
          description: Email verified
        "400":
          description: Invalid or expired token

  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend verification email
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Always succeeds (prevents email enumeration)

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset link
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Always succeeds (prevents email enumeration)
        "429":
          description: Rate limit exceeded

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  maxLength: 256
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        "200":
          description: Password reset successful
        "400":
          description: Invalid or expired token

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user with organization memberships
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/AuthUser'
        "401":
          description: Not authenticated

  # ── OAuth ────────────────────────────────────────────────────────────────
  /api/v1/auth/oauth/providers:
    get:
      tags: [OAuth]
      summary: List configured OAuth providers
      operationId: getOAuthProviders
      security: []
      responses:
        "200":
          description: List of available providers (google, github, twitch)

  /api/v1/auth/oauth/{provider}:
    get:
      tags: [OAuth]
      summary: Initiate OAuth flow (redirects to provider)
      operationId: initiateOAuth
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github, twitch]
      responses:
        "302":
          description: Redirect to OAuth provider
        "400":
          description: Invalid or unconfigured provider
    delete:
      tags: [OAuth]
      summary: Unlink OAuth account
      operationId: unlinkOAuth
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github, twitch]
      responses:
        "200":
          description: Account unlinked
        "400":
          description: Cannot unlink last auth method

  /api/v1/auth/oauth/{provider}/callback:
    get:
      tags: [OAuth]
      summary: OAuth callback handler (redirects to frontend)
      operationId: oauthCallback
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to frontend with tokens

  /api/v1/auth/oauth/{provider}/link:
    post:
      tags: [OAuth]
      summary: Link OAuth account to current user
      operationId: linkOAuth
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github, twitch]
      responses:
        "200":
          description: Authorization URL for linking
        "400":
          description: Already linked

  /api/v1/auth/oauth/connections:
    get:
      tags: [OAuth]
      summary: List linked OAuth accounts
      operationId: getOAuthConnections
      responses:
        "200":
          description: User OAuth connections

  # ── Sessions ─────────────────────────────────────────────────────────────
  /api/sessions:
    get:
      tags: [Sessions]
      summary: List sessions with filtering and pagination
      operationId: listSessions
      parameters:
        - name: workflow
          in: query
          schema:
            type: string
            maxLength: 100
        - name: captureMode
          in: query
          schema:
            type: string
            maxLength: 50
        - name: active
          in: query
          schema:
            type: string
            enum: ["true", "false"]
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: orderBy
          in: query
          schema:
            type: string
            enum: [startedAt, createdAt, updatedAt]
            default: startedAt
        - name: orderDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        "429":
          description: Rate limit exceeded (30 req/min)

  /api/sessions/{id}:
    get:
      tags: [Sessions]
      summary: Get session by ID
      operationId: getSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: include
          in: query
          schema:
            type: string
            enum: [relations]
          description: Set to "relations" to include events, outputs, and clips
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      session:
                        $ref: '#/components/schemas/Session'
        "400":
          description: Invalid session ID format
        "404":
          description: Session not found
    patch:
      tags: [Sessions]
      summary: Update session metadata
      operationId: updateSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                participants:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    maxLength: 100
      responses:
        "200":
          description: Session updated
        "404":
          description: Session not found
    delete:
      tags: [Sessions]
      summary: Delete session and all related data
      operationId: deleteSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        "200":
          description: Session deleted
        "400":
          description: Cannot delete active session
        "404":
          description: Session not found

  /api/sessions/{id}/end:
    post:
      tags: [Sessions]
      summary: End a session
      operationId: endSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        "200":
          description: Session ended with duration
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      session:
                        $ref: '#/components/schemas/Session'
                      message:
                        type: string
        "400":
          description: Session already ended
        "404":
          description: Session not found

  /api/sessions/{id}/outputs:
    get:
      tags: [Sessions, Outputs]
      summary: List outputs for a session
      operationId: getSessionOutputs
      parameters:
        - $ref: '#/components/parameters/SessionId'
