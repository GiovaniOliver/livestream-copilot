          schema:
            type: string
      responses:
        "200":
          description: Reference image list
    post:
      tags: [Triggers]
      summary: Upload visual trigger reference image
      operationId: addVisualTrigger
      security: []
      parameters:
        - name: workflow
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, label]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, GIF, or WebP (max 5MB)
                label:
                  type: string
                  maxLength: 50
                threshold:
                  type: number
