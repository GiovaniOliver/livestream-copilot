      summary: List events with filtering
      operationId: listEvents
      security: []
      parameters:
        - name: sessionId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: types
          in: query
          schema:
            type: string
          description: Comma-separated event types
        - name: afterTs
          in: query
          schema:
            type: string
          description: Filter events after this unix timestamp
        - name: beforeTs
          in: query
          schema:
            type: string
          description: Filter events before this unix timestamp
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - $ref: '#/components/parameters/OffsetParam'
        - name: orderDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          $ref: '#/components/schemas/Event'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

  /api/events/{id}:
    get:
      tags: [Events]
      summary: Get event by ID
      operationId: getEvent
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event details
        "404":
          description: Event not found

  /api/events/moments:
    get:
      tags: [Events]
      summary: List moment markers
      operationId: listMoments
      security: []
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        "200":
          description: Moment markers for session
    post:
      tags: [Events]
      summary: Create a moment marker
      operationId: createMoment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, label, timestamp]
              properties:
                sessionId:
                  type: string
                type:
                  type: string
                  enum: [hype, qa, sponsor, clip, highlight, marker]
                  default: marker
                label:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 1000
                timestamp:
                  type: number
                  minimum: 0
                clipId:
                  type: string
            example:
              sessionId: cmlbcgemg0000i7b80ufgh3ko
              type: hype
              label: Big reaction
              timestamp: 342.5
      responses:
        "201":
          description: Moment created
        "404":
          description: Session not found

  /api/events/moments/{momentId}:
    delete:
      tags: [Events]
      summary: Delete a moment marker
      operationId: deleteMoment
      parameters:
        - name: momentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Moment deleted
        "400":
          description: Event is not a moment marker
        "404":
          description: Moment not found

  /api/sessions/{sessionId}/events:
    get:
      tags: [Sessions, Events]
