            schema:
              type: object
              required: [connectionId, content]
              properties:
                connectionId:
                  type: string
                content:
                  type: object
                  properties:
                    text:
                      type: string
                      maxLength: 10000
                    title:
                      type: string
                      maxLength: 500
                    description:
                      type: string
                      maxLength: 5000
                    hashtags:
                      type: array
