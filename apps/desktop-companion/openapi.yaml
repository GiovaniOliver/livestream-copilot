      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow, captureMode]
              properties:
                workflow:
                  type: string
                  enum: [streamer, writers_room, brainstorm, debate, podcast]
                captureMode:
                  type: string
                  enum: [audio, video, av]
                title:
                  type: string
                participants:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
            example:
              workflow: podcast
              captureMode: av
              title: Episode 42 - AI in Content Creation
              participants:
                - id: host1
                  name: Alex
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  sessionId:
                    type: string
                  startedAt:
                    type: number
                  ws:
                    type: string
